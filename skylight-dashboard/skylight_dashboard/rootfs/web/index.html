<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div id="clock">
        <div id="time"></div>
        <div id="date"></div>
      </div>
      <div id="weather"></div>
      <button id="settings-btn" title="Settings">⚙</button>
    </header>

    <main id="layout">
      <section id="calendar-panel">
        <div id="month-nav">
          <button id="prev-month">‹</button>
          <h2 id="month-label"></h2>
          <button id="next-month">›</button>
        </div>
        <div id="grid-weekdays"></div>
        <div id="grid" class="month-grid"></div>
      </section>

      <aside id="agenda-panel">
        <h2>Today</h2>
        <div id="agenda-list"></div>
      </aside>
    </main>
  </div>

  <div id="settings-modal" class="hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Accounts &amp; Calendars</h2>
        <button id="close-settings">✕</button>
      </div>
      <div id="accounts-list"></div>
      <button id="connect-account-btn">+ Connect Google Account</button>
      <div id="device-flow-box" class="hidden">
        <p>On your phone or computer, go to:</p>
        <p class="verification-url" id="verification-url"></p>
        <p>and enter this code:</p>
        <p class="user-code" id="user-code"></p>
        <p id="device-flow-status">Waiting for you to authorize…</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
