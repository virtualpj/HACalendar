name: "Skylight Dashboard"
version: "0.1.0"
slug: "skylight_dashboard"
description: "A Skylight-style family calendar dashboard: multiple Google Calendars, color-coded, with two-way Home Assistant integration."
url: "https://github.com/virtualpj/HACalendar"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-clock
panel_title: "Dashboard"
hassio_api: true
hassio_role: homeassistant
homeassistant_api: true
options:
  google_client_id: ""
  google_client_secret: ""
  weather_entity_id: ""
schema:
  google_client_id: str
  google_client_secret: password
  weather_entity_id: "str?"
